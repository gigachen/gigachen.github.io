<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f6f8ff">
  <link rel="icon" type="image/svg+xml" href="/taptap-icon.svg">
  <title>Opening your TapTap link…</title>
  <noscript><meta http-equiv="refresh" content="0;url=https://taptap-admin.admin-service.workers.dev/r/demo/"></noscript>
  <style>
    * { box-sizing: border-box; }
    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
      padding: 20px;
      background: radial-gradient(ellipse at 50% 35%, #e9f0ff, #f6f8ff 70%);
      color: #13235a;
      font: 16px Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: clamp(24px, 8vw, 44px);
      border: 1px solid #cbd5ee;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 16px 48px #183ba814;
      text-align: center;
    }
    .signal {
      position: relative;
      display: grid;
      place-items: center;
      width: 128px;
      height: 128px;
      margin: 0 auto 12px;
    }
    .signal img { position: relative; }
    .signal::before, .signal::after {
      content: '';
      position: absolute;
      inset: 14px;
      border: 1px solid #a9c8ef;
      border-radius: 50%;
    }
    .signal::after { inset: 24px; }
    h1 {
      margin: 0;
      font-size: clamp(26px, 6vw, 34px);
      line-height: 1.12;
      letter-spacing: -.04em;
      text-wrap: balance;
    }
    .detail { margin: 12px 0 0; color: #5d6989; line-height: 1.5; }
    [data-redirecting] .detail { display: none; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 22px;
      padding: 8px 18px;
      border: 1px solid #cbd5ee;
      border-radius: 100px;
      background: #f6f8ff;
      color: #183ba8;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }
    a:hover { background: #e9f0ff; }
    a:focus-visible { outline: 2px solid #183ba8; outline-offset: 4px; }
    @media (prefers-reduced-motion: no-preference) {
      [data-redirecting] .signal::before, [data-redirecting] .signal::after {
        animation: signal-pulse 1.6s ease-out 3;
      }
      [data-redirecting] .signal::after { animation-delay: -.8s; }
    }
    @keyframes signal-pulse {
      from { opacity: 1; transform: scale(1); }
      to { opacity: 0; transform: scale(1.45); }
    }
  </style>
</head>
<body>
  <main data-redirecting>
    <div class="signal" aria-hidden="true"><img src="/taptap-icon.svg" width="64" height="64" alt=""></div>
    <h1>Opening your TapTap link…</h1>
    <a href="https://taptap-admin.admin-service.workers.dev/r/demo/" rel="noreferrer">Continue to your link</a>
  </main>
  <script>location.replace("https://taptap-admin.admin-service.workers.dev/r/demo/");</script>
</body>
</html>
